[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "svgshot"
version = "0.1.0"
description = "Simplify GUI screenshots into editable SVG"
requires-python = ">=3.10"
dependencies = ["Pillow>=10", "numpy>=1.24", "scipy>=1.10"]

[project.scripts]
svgshot = "svgshot.cli:main"
svgshot-capture = "svgshot.capture:main"
svgshot-grab = "svgshot.grab:main"
svgshot-fixture = "svgshot.fixture:main"

[tool.setuptools.packages.find]
include = ["svgshot*"]
