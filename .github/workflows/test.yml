name: test
on:
  push:
  pull_request:
jobs:
  fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr inkscape fonts-dejavu-core
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
