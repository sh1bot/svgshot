name: Windows capture
on:
  push:
  pull_request:
jobs:
  native:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4
      - name: Configure Windows SDK helper
        run: cmake -S capture/windows -B build/capture -A ${{ matrix.arch }}
      - name: Build
        run: cmake --build build/capture --config Release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exercise UIA, window capture, and PNG encoding
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          & build/capture/Release/svgshot-capture-win.exe --geometry-self-test
          if ($LASTEXITCODE -ne 0) { throw '150% DPI geometry regression' }
          & build/capture/Release/svgshot-capture-win.exe --dpi-self-test
          if ($LASTEXITCODE -ne 0) { throw 'DPI observation regression' }
          & build/capture/Release/svgshot-capture-win.exe --accessibility-selection-self-test
          if ($LASTEXITCODE -ne 0) { throw 'Accessibility selection regression' }
          $fixture = Start-Process build/capture/Release/svgshot-capture-win.exe -ArgumentList '--fixture' -PassThru
          try {
            for ($i = 0; $i -lt 40; $i++) {
              $fixture.Refresh()
              if ($fixture.MainWindowHandle -ne 0) { break }
              Start-Sleep -Milliseconds 100
            }
            if ($fixture.MainWindowHandle -eq 0) { throw 'Fixture window did not open' }
            & build/capture/Release/svgshot-capture-win.exe --hwnd "$($fixture.MainWindowHandle)" --out build/smoke.png --uia-only --accessibility-api uia
            if ($LASTEXITCODE -ne 0) { throw 'UIA snapshot failed' }
            $snapshot = Get-Content -Raw build/smoke.uia.json | ConvertFrom-Json
            if ($snapshot.root.label -ne 'svgshot Capture Fixture') { throw 'Wrong window title' }
            $raw = Get-Content -Raw build/smoke.uia.json
            if (!$raw.Contains('Add…') -or !$raw.Contains('Preserve semantics') -or !$raw.Contains('"checked":"checked"')) { throw 'Missing control semantics' }
            & build/capture/Release/svgshot-capture-win.exe --hwnd "$($fixture.MainWindowHandle)" --out build/live.png --json --accessibility-api uia
            if ($LASTEXITCODE -ne 0) { throw 'Window bitmap capture failed' }
            & build/capture/Release/svgshot-capture-win.exe --hwnd "$($fixture.MainWindowHandle)" --out build/broad.png --include-hidden-content --accessibility-api uia
            if ($LASTEXITCODE -ne 0) { throw 'Opt-in full capture failed' }
            python tests/native_capture_smoke.py "$($fixture.MainWindowHandle)"
            if ($LASTEXITCODE -ne 0) { throw 'Embedded snapshot or broad semantics validation failed' }
            & build/capture/Release/svgshot-capture-win.exe --hwnd "$($fixture.MainWindowHandle)" --out build/embedded.png
            if ($LASTEXITCODE -ne 0) { throw 'Self-contained capture failed' }
            if (Test-Path build/embedded.uia.json) { throw 'Default capture unexpectedly writes JSON sidecar' }
            python -m svgshot.snapshot build/embedded.png --json build/extracted.json
            if ($LASTEXITCODE -ne 0) { throw 'PNG-only extraction failed' }
            Add-Type -AssemblyName System.Drawing
            $png = [System.Drawing.Image]::FromFile((Resolve-Path build/live.png))
            try {
              $live = Get-Content -Raw build/live.uia.json | ConvertFrom-Json
              if ($live.image.size[0] -ne $png.Width -or $live.image.size[1] -ne $png.Height) { throw 'PNG/UIA dimensions differ' }
            } finally { $png.Dispose() }
            Add-Type -AssemblyName System.Drawing
            foreach ($capture in @('build/compatibility.png', 'build/screen.png')) {
              $bitmap = [System.Drawing.Bitmap]::new((Resolve-Path $capture).Path)
              try {
                $colors = @{}
                for ($y = 0; $y -lt $bitmap.Height; $y += 9) {
                  for ($x = 0; $x -lt $bitmap.Width; $x += 9) {
                    $pixel = $bitmap.GetPixel($x, $y)
                    if ($pixel.A -ne 255) { throw "$capture has transparent pixels" }
                    $colors[$pixel.ToArgb()] = $true
                  }
                }
                if ($colors.Count -lt 4) { throw "$capture appears blank" }
              } finally { $bitmap.Dispose() }
            }
          } finally { Stop-Process -Id $fixture.Id -ErrorAction SilentlyContinue }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: svgshot-capture-${{ matrix.arch }}
          path: |
            build/capture/Release/svgshot-capture-win.exe
            build/live.png
            build/live.uia.json
            build/broad.png
