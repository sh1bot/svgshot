name: Capture binaries
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: Win32, name: x86}
          - {arch: x64, name: x86_64}
          - {arch: ARM64, name: aarch64}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S capture/windows -B build/capture -A ${{ matrix.arch }}
      - run: cmake --build build/capture --config Release
      - uses: actions/setup-python@v5
        if: matrix.name == 'x86_64'
        with:
          python-version: '3.12'
      - name: Validate native capture before release
        if: matrix.name == 'x86_64'
        shell: pwsh
        run: |
          $fixture = Start-Process build/capture/Release/svgshot-capture-win.exe -ArgumentList '--fixture' -PassThru
          try {
            for ($i = 0; $i -lt 40; $i++) {
              $fixture.Refresh()
              if ($fixture.MainWindowHandle -ne 0) { break }
              Start-Sleep -Milliseconds 100
            }
            if ($fixture.MainWindowHandle -eq 0) { throw 'Fixture did not open' }
            & build/capture/Release/svgshot-capture-win.exe --hwnd "$($fixture.MainWindowHandle)" --out build/live.png --json
            if ($LASTEXITCODE -ne 0) { throw 'Capture failed' }
            & build/capture/Release/svgshot-capture-win.exe --hwnd "$($fixture.MainWindowHandle)" --out build/broad.png --include-hidden-content
            if ($LASTEXITCODE -ne 0) { throw 'Broad capture failed' }
            python tests/native_capture_smoke.py "$($fixture.MainWindowHandle)"
            if ($LASTEXITCODE -ne 0) { throw 'Capture validation failed' }
            Add-Type -AssemblyName System.Drawing
            $bitmap = [System.Drawing.Bitmap]::new((Resolve-Path build/compatibility.png).Path)
            try {
              $colors = @{}
              for ($y = 0; $y -lt $bitmap.Height; $y += 9) {
                for ($x = 0; $x -lt $bitmap.Width; $x += 9) {
                  $pixel = $bitmap.GetPixel($x, $y)
                  if ($pixel.A -ne 255) { throw 'Compatibility capture has transparent pixels' }
                  $colors[$pixel.ToArgb()] = $true
                }
              }
              if ($colors.Count -lt 4) { throw 'Compatibility capture appears blank' }
            } finally { $bitmap.Dispose() }
          } finally { Stop-Process -Id $fixture.Id -ErrorAction SilentlyContinue }
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/capture/Release/svgshot-capture-win.exe dist/svgshot-capture-windows-${{ matrix.name }}.exe
          if ('${{ matrix.name }}' -eq 'x86_64') {
            $version = & dist/svgshot-capture-windows-x86_64.exe --version
            if ($version -ne 'svgshot-capture-win ${{ github.sha }}') { throw 'Wrong embedded commit' }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: capture-windows-${{ matrix.name }}
          path: dist/svgshot-capture-windows-${{ matrix.name }}.exe
  macos:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Build native Swift helper
        run: |
          mkdir -p dist
          python3 scripts/build_macos_capture.py dist/svgshot-capture-macos-${{ matrix.arch }} --arch ${{ matrix.arch }} --commit '${{ github.sha }}'
          file dist/svgshot-capture-macos-${{ matrix.arch }}
      - name: Smoke native executable
        if: matrix.arch == 'arm64'
        run: |
          dist/svgshot-capture-macos-arm64 --help
          test "$(dist/svgshot-capture-macos-arm64 --version)" = 'svgshot-capture-macos ${{ github.sha }}'
      - uses: actions/upload-artifact@v4
        with:
          name: capture-macos-${{ matrix.arch }}
          path: dist/svgshot-capture-macos-${{ matrix.arch }}
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86, image: 'debian:bookworm-slim'}
          - {arch: x86_64, image: 'debian:bookworm-slim'}
          - {arch: armv7, image: 'debian:bookworm-slim'}
          - {arch: aarch64, image: 'debian:bookworm-slim'}
          - {arch: riscv64, image: 'debian:trixie-slim'}
    steps:
      - uses: actions/checkout@v4
      - name: Build native capture
        run: |
          docker run --rm -v "$PWD:/src" -w /src ${{ matrix.image }} sh scripts/build_linux_capture.sh ${{ matrix.arch }}
          file dist/svgshot-capture-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: capture-linux-${{ matrix.arch }}
          path: dist/svgshot-capture-linux-${{ matrix.arch }}
  linux-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libatspi2.0-dev libx11-dev libpng-dev libjson-c-dev python3-gi python3-pil gir1.2-atspi-2.0 gir1.2-gtk-3.0 at-spi2-core xvfb dbus-x11
      - run: cmake -S capture/linux -B build/capture && cmake --build build/capture -j2
      - run: |
          test "$(build/capture/svgshot-capture-linux --version)" = 'svgshot-capture-linux ${{ github.sha }}'
          dbus-run-session -- xvfb-run -a /usr/bin/python3 tests/linux_capture_smoke.py "$PWD/build/capture/svgshot-capture-linux"
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [windows, macos, linux, linux-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: capture-latest-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: capture-*
          merge-multiple: true
          path: binaries
      - name: Publish latest-source binaries
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # An older slow matrix must never overwrite a newer main build.
          current=$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq .object.sha)
          if [ "$current" != '${{ github.sha }}' ]; then exit 0; fi
          cat > notes.txt <<'EOF'
          Windows: x86, x64, ARM64
          macOS 14+: x64, ARM64
          Linux (glibc): x86, x64, ARMv7, ARM64, RISC-V64

          Linux capture requires AT-SPI2 and X11. Wayland requires a supplied bitmap.
          EOF
          if gh release view capture-latest >/dev/null 2>&1; then
            gh release edit capture-latest --target '${{ github.sha }}' --title 'Latest capture tools' --notes-file notes.txt
          else
            gh release create capture-latest --target '${{ github.sha }}' --title 'Latest capture tools' --notes-file notes.txt --prerelease
          fi
          # Move the rolling tag as well as the release target.
          gh api --method PATCH repos/${{ github.repository }}/git/refs/tags/capture-latest -f sha='${{ github.sha }}' -F force=true
          gh release upload capture-latest binaries/* --clobber
          # Remove the superseded multi-file packages after the new files upload.
          gh release view capture-latest --json assets --jq '.assets[].name' | while IFS= read -r asset; do
            case "$asset" in *.zip|*.tar.gz) gh release delete-asset capture-latest "$asset" --yes ;; esac
          done
